name: diag-beatport
# Temporary: shows what Beatport/Dice/RA serve to a GitHub runner. Delete after use.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Probe
        run: |
          uv run python - <<'EOF'
          import json, urllib.request
          from curl_cffi import requests

          ip = urllib.request.urlopen("https://ipinfo.io/json", timeout=15).read().decode()
          info = json.loads(ip)
          print("RUNNER:", info.get("ip"), "|", info.get("org"), "|", info.get("city"), info.get("country"))

          def probe(label, url, profile="chrome", **kw):
              try:
                  r = requests.get(url, impersonate=profile, timeout=30, **kw)
                  h = r.headers
                  body = r.text[:160].replace("\n", " ")
                  print(f"{label:<34} {profile:<10} HTTP {r.status_code} len={len(r.text):<8} "
                        f"server={h.get('server')} cf-mitigated={h.get('cf-mitigated')} "
                        f"next_data={'__NEXT_DATA__' in r.text}")
                  if r.status_code != 200:
                      print("    body:", body)
              except Exception as e:
                  print(f"{label:<34} {profile:<10} EXC {type(e).__name__}: {e}")

          B = "https://www.beatport.com/genre/tech-house/11/top-100"
          for p in ["chrome", "chrome136", "safari184", "firefox144", "edge101"]:
              probe("beatport top-100", B, p)
          probe("beatport home", "https://www.beatport.com/")
          probe("beatport top-100 (no www)", "https://beatport.com/genre/tech-house/11/top-100")
          probe("beatport api-internal", "https://api-internal.beatportprod.com/v4/catalog/genres/11/")
          probe("beatport sitemap", "https://www.beatport.com/robots.txt")
          probe("dice venue", "https://dice.fm/venue/club-space-miami-wlav")
          probe("RA graphql (GET)", "https://ra.co/graphql")
          EOF
