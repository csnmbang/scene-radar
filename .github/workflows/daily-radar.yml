name: daily-radar

on:
  schedule:
    # 11:37 UTC = 7:37 AM Miami (EDT). Deliberately early and on an odd
    # minute: GitHub runs cron on a best-effort queue and the :00/:05 slots
    # are heavily contended, so runs land late.
    #
    # Observed start times over the last two weeks of Oct/Nov were 16:15-20:51
    # UTC, i.e. 4-9 hours after this slot — GitHub drops or defers scheduled
    # runs under load, and a dropped one never fires at all. The two later
    # slots are backups: whichever fires first does the work, and the `check`
    # job below turns the others into no-ops once today's snapshot exists.
    - cron: "37 11 * * *"
    - cron: "23 14 * * *"
    - cron: "53 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  # Skip a scheduled run if today's snapshot is already committed, so the
  # backup crons don't each add another ~8MB DuckDB blob to the repo history.
  # Manual dispatches always run — that's the override.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - id: today
        run: |
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] \
             && git log --format=%s -15 | grep -qx "Daily snapshot $today"; then
            echo "Snapshot for $today already committed — backup run is a no-op."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  collect-and-deploy:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run pipeline (collect → score → build dashboard)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SABER_DATABASE_URL: ${{ secrets.SABER_DATABASE_URL }}
        run: uv run python run_all.py

      - name: Run tests
        run: uv run pytest -q

      - name: Commit updated snapshots
        run: |
          git config user.name "scene-radar-bot"
          git config user.email "actions@github.com"
          git add data/scene_radar.duckdb manual_events.json calls.json
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          # Discard anything still dirty that wasn't part of that commit on
          # purpose (a stray tracked file the run touched but this step never
          # intended to persist) — otherwise a rebase run twice in one day can
          # find the tree dirty and refuse to pull.
          git checkout -- .
          git pull --rebase origin master
          git push origin master

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp dashboard.html site/index.html
          echo "radar.xtremedigits.com" > site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The snapshot is already committed by this point, so a Pages hiccup
      # costs freshness, not data. deploy-pages has timed out on GitHub's side
      # before (Aug 6, Nov 6); one retry clears most of those.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry Pages deploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
