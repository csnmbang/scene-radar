<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Radar — Miami</title>
<style>
  :root {
    --page: #0b0b0d;
    --surface: #111113;
    --surface-2: #17171a;
    --ink: #f5f5f4;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255,255,255,0.08);
    --accent: #3987e5;
    --s1: #3987e5; /* tech house */
    --s2: #d95926; /* techno peak */
    --s3: #199e70; /* hard techno */
    --s4: #c98500; /* minimal/deep tech */
    --s5: #d55181; /* house */
    --s6: #008300; /* melodic h&t */
    --s7: #9085e9; /* progressive house */
    --s8: #e66767; /* afro house */
    /* The validated categorical palette is 8 hues. Indie Dance is the 9th
       genre, so per the palette rules it folds to a neutral rather than
       getting an invented hue — safe here because every genre dot sits
       directly beside its own label, so colour never carries identity alone. */
    --s9: #898781;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 24px;
    padding: 14px 28px; background: rgba(11,11,13,0.85);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: 0.06em; font-size: 14px; }
  .brand .dot { color: var(--accent); }
  .snapshot { color: var(--muted); font-size: 12.5px; margin-left: auto; }

  nav { display: flex; gap: 4px; }
  nav button {
    all: unset; cursor: pointer; padding: 6px 14px; border-radius: 999px;
    font-size: 13px; color: var(--ink-2); transition: background .15s, color .15s;
  }
  nav button:hover { background: var(--surface-2); color: var(--ink); }
  nav button.active { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }

  main { max-width: 1180px; margin: 0 auto; padding: 28px; }
  section { display: none; }
  section.active { display: block; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px;
  }
  .stat .v { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
  .stat .v.hot { color: var(--accent); }
  .stat .k { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .controls input[type="search"] {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; width: 220px; outline: none;
  }
  .controls input[type="search"]:focus { border-color: var(--accent); }
  .controls select {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 7px 10px; font-size: 13px;
  }
  .controls label { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
  .controls input[type="range"] { accent-color: var(--accent); }
  .chip {
    cursor: pointer; padding: 5px 11px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--border); color: var(--ink-2); background: transparent;
    display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .chip .swatch { width: 8px; height: 8px; border-radius: 50%; }
  .chip.on { background: var(--surface-2); color: var(--ink); border-color: rgba(255,255,255,0.2); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left; color: var(--muted); font-size: 11.5px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 10px;
    border-bottom: 1px solid var(--grid); cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th.sorted { color: var(--ink); }
  tbody td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  .table-wrap { overflow-x: auto; }

  .scorebar { display: flex; align-items: center; gap: 10px; min-width: 160px; }
  .scorebar .track { flex: 1; height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }
  .scorebar .fill { height: 100%; border-radius: 2px; background: var(--accent); }
  .scorebar .val { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-2); width: 42px; text-align: right; }

  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 550;
  }
  .pill.zero { background: rgba(57,135,229,0.15); color: #7ab2f0; }
  .pill.some { background: var(--surface-2); color: var(--ink-2); }
  .pill.hit { background: rgba(12,163,12,0.18); color: #4fbf95; }
  .pill.miss { background: rgba(208,59,59,0.16); color: #e08585; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 5px; font-weight: 600; letter-spacing: .04em; }
  .badge.dice { background: rgba(213,81,129,0.16); color: #e08bad; }
  .badge.ra { background: rgba(25,158,112,0.16); color: #4fbf95; }
  .badge.manual { background: rgba(144,133,233,0.16); color: #a99ff0; }
  .gtag { display: inline-flex; align-items: center; gap: 5px; margin-right: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .gtag .swatch { width: 7px; height: 7px; border-radius: 50%; }

  .hbar-chart { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; align-items: center; }
  .hbar-label { color: var(--ink-2); font-size: 13px; text-align: right; white-space: nowrap; }
  .hbar-group { display: flex; flex-direction: column; gap: 3px; }
  .hbar-row { display: flex; align-items: center; gap: 8px; }
  .hbar {
    height: 13px; border-radius: 0 4px 4px 0; min-width: 2px;
    transition: opacity .15s;
  }
  .hbar:hover { opacity: 0.85; }
  .hbar-val { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 18px; margin-bottom: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .legend .swatch { width: 9px; height: 9px; border-radius: 3px; }

  .why { cursor: help; border-bottom: 1px dotted rgba(255,255,255,0.25); }
  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0;
    transition: opacity .12s; max-width: 420px;
    background: #1b1b1f; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; padding: 12px 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
  }
  #tip.on { opacity: 1; }
  #tip .tip-h { font-size: 13px; font-weight: 650; margin-bottom: 2px; }
  #tip .tip-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 9px; }
  #tip table { font-size: 12px; }
  #tip td { padding: 3px 8px 3px 0; border: 0; vertical-align: top; }
  #tip .tr-rank { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  #tip .tr-title { color: var(--ink); }
  #tip .tr-mix, #tip .tr-label { color: var(--muted); font-size: 11px; }

  .note {
    border: 1px solid rgba(201,133,0,0.35); background: rgba(201,133,0,0.07);
    color: var(--ink-2); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 16px;
  }
  .delta-pos { color: #4fbf95; }
  .delta-neg { color: var(--muted); }
  footer {
    color: var(--muted); font-size: 12px; text-align: center;
    padding: 20px 24px 40px; line-height: 1.7; max-width: 780px; margin: 0 auto;
  }
</style>
</head>
<body>
<header>
  <div class="brand">SCENE<span class="dot">·</span>RADAR</div>
  <nav id="nav"></nav>
  <div class="snapshot" id="snapshot"></div>
</header>
<main id="main"></main>
<div id="tip"></div>
<footer id="footer"></footer>

<script>
const DATA = /*__DATA__*/{};

const BUCKET_COLOR = {
  "tech-house": "var(--s1)",
  "techno-peak-time-driving": "var(--s2)",
  "hard-techno": "var(--s3)",
  "minimal-deep-tech": "var(--s4)",
  "house": "var(--s5)",
  "melodic-house-techno": "var(--s6)",
  "progressive-house": "var(--s7)",
  "afro-house": "var(--s8)",
  "indie-dance": "var(--s9)",
};
const LABEL_BY_KEY = Object.fromEntries(DATA.genreKeys.map((k, i) => [k, DATA.genreLabels[i]]));
const KEY_BY_LABEL = Object.fromEntries(DATA.genreKeys.map((k, i) => [DATA.genreLabels[i], k]));

const TABS = ["Gaps", "Genres", "Venues", "Supply", "Timeline", "Track record"];
const nav = document.getElementById("nav");
const main = document.getElementById("main");
document.getElementById("snapshot").textContent =
  `snapshot ${DATA.snapshot} · built ${DATA.generated}`;
document.getElementById("footer").innerHTML =
  `Demand: Beatport Top 100 (7 genres) · Supply: Resident Advisor Miami + Dice + manual adds · next 90 days<br>
   Club Space, Sable and M2 ticket on Dice and never post upcoming events on RA, so their genre mix is inferred from lineups rather than tags.`;

TABS.forEach((t, i) => {
  const b = document.createElement("button");
  b.textContent = t;
  b.onclick = () => selectTab(i);
  nav.appendChild(b);
});
function selectTab(i) {
  [...nav.children].forEach((b, j) => b.classList.toggle("active", i === j));
  [...main.children].forEach((s, j) => s.classList.toggle("active", i === j));
}

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const srcBadge = (s) => s === "dice" ? `<span class="badge dice">DICE</span>`
  : s === "manual" ? `<span class="badge manual">MANUAL</span>` : `<span class="badge ra">RA</span>`;
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; };

function scorebar(v, max = 100) {
  return `<div class="scorebar"><div class="track"><div class="fill" style="width:${Math.max(1, 100*v/max)}%"></div></div><span class="val">${v.toFixed(1)}</span></div>`;
}
function genreTags(keys) {
  return keys.map(k => `<span class="gtag"><span class="swatch" style="background:${BUCKET_COLOR[k]||"var(--muted)"}"></span>${esc(LABEL_BY_KEY[k]||k)}</span>`).join("");
}
function sortable(table, rows, renderRows, defaults) {
  let [sortKey, sortDir] = defaults;
  const ths = table.querySelectorAll("thead th[data-k]");
  ths.forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    sortDir = (k === sortKey && sortDir === -1) ? 1 : -1;
    sortKey = k;
    ths.forEach(t => t.classList.toggle("sorted", t === th));
    render();
  }));
  function render() {
    const sorted = [...rows()].sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
    });
    renderRows(sorted);
  }
  return render;
}

/* ---------------- Gaps ---------------- */
const gapsSection = el(`<section>
  <div class="stats">
    <div class="stat"><div class="v hot">${DATA.stats.hotGaps}</div><div class="k">hot gaps (demand ≥ 40, zero dates)</div></div>
    <div class="stat"><div class="v">${DATA.stats.artists}</div><div class="k">charting artists tracked</div></div>
    <div class="stat"><div class="v">${DATA.stats.events}</div><div class="k">Miami events · ${DATA.stats.eventsRa} RA + ${DATA.stats.eventsDice} Dice</div></div>
    <div class="stat"><div class="v">${DATA.stats.venues}</div><div class="k">venues booking</div></div>
    <div class="stat"><div class="v">${DATA.stats.matched}</div><div class="k">artists matched to lineups</div></div>
  </div>
  <div class="card">
    <h2>Gap table</h2>
    <div class="sub">Artists trending on Beatport, ranked by gap score = demand ÷ (1 + upcoming Miami bookings), discounted if they played Miami in the last ${DATA.recencyWindow} days. <strong>Hover any row</strong> to see the tracks driving the demand score.</div>
    <div class="controls">
      <input type="search" id="gap-search" placeholder="Search artist…">
      <label>min demand <input type="range" id="gap-demand" min="0" max="100" value="20"> <span id="gap-demand-v">20</span></label>
      <select id="gap-book">
        <option value="0">0 bookings</option>
        <option value="1" selected>≤ 1 booking</option>
        <option value="99">any bookings</option>
      </select>
      <label style="gap:6px"><input type="checkbox" id="gap-touring"> touring elsewhere only</label>
      <span id="gap-chips"></span>
      <span style="margin-left:auto;color:var(--muted);font-size:12px" id="gap-count"></span>
    </div>
    <div class="table-wrap"><table id="gap-table">
      <thead><tr>
        <th data-k="artist">Artist</th><th data-k="demand">Demand</th><th data-k="bookings">Bookings 90d</th>
        <th data-k="lastPlayedSort">Last played</th>
        <th data-k="touringSort">Touring elsewhere</th>
        <th data-k="gap" class="sorted">Gap score</th><th data-k="tracks">Tracks</th><th>Charting on</th>
      </tr></thead><tbody></tbody>
    </table></div>
  </div>
</section>`);
main.appendChild(gapsSection);

const gapChips = gapsSection.querySelector("#gap-chips");
const activeBuckets = new Set();
DATA.genreKeys.forEach(k => {
  const c = el(`<button class="chip"><span class="swatch" style="background:${BUCKET_COLOR[k]}"></span>${esc(LABEL_BY_KEY[k])}</button>`);
  c.onclick = () => { c.classList.toggle("on"); activeBuckets.has(k) ? activeBuckets.delete(k) : activeBuckets.add(k); renderGaps(); };
  gapChips.appendChild(c);
});

const gapRows = () => {
  const q = gapsSection.querySelector("#gap-search").value.toLowerCase();
  const minD = +gapsSection.querySelector("#gap-demand").value;
  const maxB = +gapsSection.querySelector("#gap-book").value;
  const touringOnly = gapsSection.querySelector("#gap-touring").checked;
  return DATA.gaps.filter(g =>
    g.demand >= minD && g.bookings <= maxB &&
    (!touringOnly || (g.touring?.markets?.length ?? 0) > 0) &&
    (!q || g.artist.toLowerCase().includes(q)) &&
    (!activeBuckets.size || g.genres.some(x => activeBuckets.has(x))))
    .map(g => ({...g, lastPlayedSort: g.lastPlayed ?? 9999,
                touringSort: (g.touring?.markets?.length ?? 0)}));
};
const MARKET_ABBR = {"New York":"NYC","Los Angeles":"LA","Mexico City":"MX","Las Vegas":"LV","Chicago":"CHI","Tulum":"TUL"};
function fmtTouring(t) {
  if (!t || !t.markets.length) return `<span style="color:var(--muted)">—</span>`;
  const label = t.markets.map(m => MARKET_ABBR[m] || m).join(" · ");
  const when = t.daysOut != null ? ` — first date in ${t.daysOut}d` : "";
  return `<span class="pill zero" title="Confirmed dates in ${t.markets.join(", ")}${when}. Routed nearby but not booked in Miami.">${label}</span>`;
}
// "never" would be a lie — we only see RA history back DATA.lookbackDays.
const LOOKBACK_LABEL = DATA.lookbackDays >= 360 ? "12mo"
  : DATA.lookbackDays >= 180 ? "6mo" : `${Math.round(DATA.lookbackDays / 30)}mo`;
const NO_LINEUP_PCT = Math.round(100 * DATA.history.noLineup / Math.max(1, DATA.history.pastEvents));
// Past the discount window, days stop being meaningful and start being wide —
// switch to months so the column stays one scannable width.
const fmtAgo = (d) => d == null
  ? `<span style="color:var(--muted)" title="No Miami show found in ${LOOKBACK_LABEL} of RA history (${DATA.history.pastEvents} past events). Not proof they never played: ${NO_LINEUP_PCT}% of past events list no lineup at all.">none in ${LOOKBACK_LABEL}</span>`
  : d < DATA.recencyWindow
    ? `<span class="pill some" title="Played Miami ${d} days ago — gap score discounted">${d}d ago</span>`
    : `<span title="Played Miami ${d} days ago">${Math.round(d / 30)}mo ago</span>`;

// Track hover: why is this artist on the radar?
const tip = document.getElementById("tip");
function showTip(g, ev) {
  if (!g.trackList || !g.trackList.length) return;
  tip.innerHTML = `<div class="tip-h">${esc(g.artist)}</div>
    <div class="tip-sub">${g.tracks} charting track${g.tracks === 1 ? "" : "s"}${g.new ? ` · ${g.new} new this snapshot` : ""}${g.velocity > 0 ? ` · climbing ${g.velocity} places` : ""}</div>
    <table><tbody>${g.trackList.map(t => `<tr>
      <td class="tr-rank">#${t.rank}</td>
      <td><span class="tr-title">${esc(t.title)}</span>${t.mix && t.mix !== "Original Mix" ? ` <span class="tr-mix">(${esc(t.mix)})</span>` : ""}
          <div class="tr-label">${esc(t.label || "—")} · ${esc(LABEL_BY_KEY[t.chart] || t.chart)}</div></td>
    </tr>`).join("")}</tbody></table>
    ${g.tracks > g.trackList.length ? `<div class="tip-sub" style="margin:8px 0 0">+ ${g.tracks - g.trackList.length} more</div>` : ""}`;
  tip.classList.add("on");
  moveTip(ev);
}
function moveTip(ev) {
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 16, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 12) x = ev.clientX - r.width - 16;
  if (y + r.height > innerHeight - 12) y = Math.max(12, ev.clientY - r.height - 14);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { tip.classList.remove("on"); }
const renderGaps = sortable(gapsSection.querySelector("#gap-table"), gapRows, (rows) => {
  gapsSection.querySelector("#gap-count").textContent = `${rows.length} artists`;
  const shown = rows.slice(0, 200);
  gapsSection.querySelector("#gap-table tbody").innerHTML = shown.map((g, i) => `<tr data-i="${i}">
    <td style="font-weight:550"><span class="why">${esc(g.artist)}</span></td>
    <td>${scorebar(g.demand)}</td>
    <td class="num"><span class="pill ${g.bookings === 0 ? "zero" : "some"}">${g.bookings === 0 ? "OPEN" : g.bookings}</span></td>
    <td class="num" style="white-space:nowrap">${fmtAgo(g.lastPlayed)}</td>
    <td style="white-space:nowrap">${fmtTouring(g.touring)}</td>
    <td>${scorebar(g.gap)}</td>
    <td class="num">${g.tracks}</td>
    <td>${genreTags(g.genres)}</td>
  </tr>`).join("");
  // hover anywhere on a row to see the tracks behind the demand score
  gapsSection.querySelectorAll("#gap-table tbody tr").forEach(tr => {
    const g = shown[+tr.dataset.i];
    tr.addEventListener("mouseenter", e => showTip(g, e));
    tr.addEventListener("mousemove", moveTip);
    tr.addEventListener("mouseleave", hideTip);
  });
}, ["gap", -1]);
["gap-search", "gap-book", "gap-touring"].forEach(id => gapsSection.querySelector("#" + id).addEventListener("input", renderGaps));
gapsSection.querySelector("#gap-demand").addEventListener("input", (e) => {
  gapsSection.querySelector("#gap-demand-v").textContent = e.target.value; renderGaps();
});

/* ---------------- Genres ---------------- */
const maxShare = Math.max(...DATA.genres.flatMap(g => [g.demand, g.supply]), 1);
const genresSection = el(`<section>
  <div class="card">
    <h2>Genre heat vs Miami supply</h2>
    <div class="sub">Demand = share of Beatport artist momentum per genre bucket (7 charts). Supply = share of Miami events per bucket — RA genre tags where present, otherwise inferred from the event's matched lineup artists. Sorted most under-served first. Positive gap = under-served in Miami.</div>
    <div class="legend">
      <span><span class="swatch" style="background:var(--s1)"></span>Demand (Beatport)</span>
      <span><span class="swatch" style="background:var(--s2)"></span>Supply (Miami events)</span>
    </div>
    <div class="hbar-chart">
      ${DATA.genres.map(g => `
        <div class="hbar-label">${esc(g.label)}</div>
        <div class="hbar-group">
          <div class="hbar-row"><div class="hbar" style="background:var(--s1);width:${88*g.demand/maxShare}%" title="demand ${g.demand}%"></div><span class="hbar-val">${g.demand}%</span></div>
          <div class="hbar-row"><div class="hbar" style="background:var(--s2);width:${88*g.supply/maxShare}%" title="supply ${g.supply}%"></div><span class="hbar-val">${g.supply}%</span></div>
        </div>`).join("")}
    </div>
  </div>
  <div class="card">
    <h2>The read</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Genre</th><th>Demand %</th><th>Supply %</th><th>Gap (pts)</th></tr></thead>
      <tbody>${[...DATA.genres].sort((a,b) => b.delta - a.delta).map(g => `<tr>
        <td>${genreTags([KEY_BY_LABEL[g.label]])}</td>
        <td class="num">${g.demand}</td><td class="num">${g.supply}</td>
        <td class="num ${g.delta > 0 ? "delta-pos" : "delta-neg"}">${g.delta > 0 ? "+" : ""}${g.delta}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="sub" style="margin-top:10px">${DATA.inferred} untagged events classified via their lineups · ${DATA.unmapped} events unclassifiable (off-bucket tags or no matched artists) and excluded from supply share.</div>
  </div>
</section>`);
main.appendChild(genresSection);

/* ---------------- Venues ---------------- */
const maxEv = Math.max(...DATA.venues.map(v => v.events), 1);
const venuesSection = el(`<section>
  <div class="card">
    <h2>Who books the most</h2>
    <div class="sub">Upcoming events per venue, next 90 days</div>
    <div class="hbar-chart">
      ${DATA.venues.slice(0, 15).map(v => `
        <div class="hbar-label">${esc(v.venue)}</div>
        <div class="hbar-row"><div class="hbar" style="background:var(--s1);width:${88*v.events/maxEv}%"></div><span class="hbar-val">${v.events}</span></div>`).join("")}
    </div>
  </div>
  <div class="card">
    <h2>Venue detail</h2>
    <div class="table-wrap"><table id="venue-table">
      <thead><tr><th data-k="venue">Venue</th><th data-k="events" class="sorted">Events</th><th data-k="artists">Artists</th><th data-k="cost">Typical price</th><th>Top genre tags</th><th>Source</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
</section>`);
main.appendChild(venuesSection);
const renderVenues = sortable(venuesSection.querySelector("#venue-table"), () => DATA.venues, rows => {
  venuesSection.querySelector("#venue-table tbody").innerHTML = rows.map(v => `<tr>
    <td style="font-weight:550">${esc(v.venue)}</td>
    <td class="num">${v.events}</td><td class="num">${v.artists}</td>
    <td class="num">${esc(v.cost)}</td><td>${esc(v.topGenres)}</td>
    <td>${srcBadge(v.source)}</td>
  </tr>`).join("");
}, ["events", -1]);

/* ---------------- Supply (events) ---------------- */
const supplySection = el(`<section>
  <div class="card">
    <h2>All upcoming events</h2>
    <div class="sub">The raw supply feed the gap counts come from</div>
    <div class="controls">
      <input type="search" id="ev-search" placeholder="Search event, artist, venue…">
      <select id="ev-source"><option value="">All sources</option><option value="graphql">RA</option><option value="dice">Dice</option><option value="manual">Manual</option></select>
      <span style="margin-left:auto;color:var(--muted);font-size:12px" id="ev-count"></span>
    </div>
    <div class="table-wrap"><table id="ev-table">
      <thead><tr><th data-k="date" class="sorted">Date</th><th data-k="name">Event</th><th>Lineup</th><th data-k="venue">Venue</th><th data-k="priceSort">Price</th><th>Source</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
</section>`);
main.appendChild(supplySection);
const evRows = () => {
  const q = supplySection.querySelector("#ev-search").value.toLowerCase();
  const src = supplySection.querySelector("#ev-source").value;
  return DATA.events.filter(e =>
    (!src || (src === "graphql" ? (e.source !== "dice" && e.source !== "manual") : e.source === src)) &&
    (!q || e.name.toLowerCase().includes(q) || e.venue.toLowerCase().includes(q) ||
      e.artists.some(a => a.toLowerCase().includes(q))))
    // unpriced events sort last rather than reading as free
    .map(e => ({...e, priceSort: e.priceValue ?? -1}));
};
const renderEvents = sortable(supplySection.querySelector("#ev-table"), evRows, rows => {
  supplySection.querySelector("#ev-count").textContent = `${rows.length} events`;
  supplySection.querySelector("#ev-table tbody").innerHTML = rows.slice(0, 400).map(e => `<tr>
    <td class="num" style="white-space:nowrap">${e.date}</td>
    <td style="font-weight:550">${esc(e.name)}</td>
    <td style="color:var(--ink-2);max-width:340px">${esc(e.artists.join(", ") || "—")}</td>
    <td>${esc(e.venue)}</td><td class="num">${esc(e.price)}</td>
    <td>${srcBadge(e.source)}</td>
  </tr>`).join("");
}, ["date", 1]);
["ev-search", "ev-source"].forEach(id => supplySection.querySelector("#" + id).addEventListener("input", renderEvents));

/* ---------------- Timeline ---------------- */
const R = DATA.receipts;
const QUALITY_WHY = {
  backfill: "The venue or promoter entered the dataset that day, bringing its existing calendar with it — not a prediction.",
  warmup: "Logged while the tracked artist set was still being established.",
  ingestion: `Under ${R.minCredibleLead} days: measures how fast we noticed an already-public announcement.`,
  genuine: "Venue already tracked and the booking appeared well after the flag.",
};
const timelineSection = el(`<section>
  <div class="stats">
    <div class="stat"><div class="v hot">${R.called}</div><div class="k">genuine early flags (lead ≥ ${R.minCredibleLead}d)</div></div>
    <div class="stat"><div class="v">${R.medianLead ?? "—"}</div><div class="k">median lead time (days)</div></div>
    <div class="stat"><div class="v" style="color:var(--muted)">${R.discounted}</div><div class="k">discounted — ingestion lag, not foresight</div></div>
    <div class="stat"><div class="v">${R.conversion30d != null ? R.conversion30d + "%" : "—"}</div><div class="k">hot gaps booked within 30d${R.conversion30d == null ? " (needs 30d of history)" : ""}</div></div>
    <div class="stat"><div class="v">${R.trackingDays}</div><div class="k">days of snapshots</div></div>
  </div>
  <div class="card">
    <h2>Radar timeline</h2>
    <div class="sub">When an artist first showed up on the radar vs. when a Miami date first appeared for them.
      A positive lead only counts as foresight if it clears ${R.minCredibleLead} days <em>and</em> the venue was already
      being tracked — otherwise it's measuring how fast we ingest an announcement that was already public.
      Discounted rows are labelled: <span class="pill some">backfill</span> a venue/promoter joined that day and brought its
      calendar, <span class="pill some">warm-up</span> logged while the artist set was still being established,
      <span class="pill some">ingestion</span> under ${R.minCredibleLead} days. Real receipts accumulate only as clean days stack up.</div>
    <div class="controls">
      <input type="search" id="tl-search" placeholder="Search artist…">
      <select id="tl-status">
        <option value="">All artists</option>
        <option value="booked" selected>Booked since on radar</option>
        <option value="open">Still open</option>
      </select>
      <label>min demand <input type="range" id="tl-demand" min="0" max="100" value="0"> <span id="tl-demand-v">0</span></label>
      <span style="margin-left:auto;color:var(--muted);font-size:12px" id="tl-count"></span>
    </div>
    <div class="table-wrap"><table id="tl-table">
      <thead><tr>
        <th data-k="artist">Artist</th><th data-k="demand">Demand</th>
        <th data-k="entered">Entered radar</th><th data-k="booked" class="sorted">Booked</th>
        <th data-k="lead">Lead (days)</th><th>Where</th>
      </tr></thead><tbody></tbody>
    </table></div>
  </div>
</section>`);
main.appendChild(timelineSection);
const tlRows = () => {
  const q = timelineSection.querySelector("#tl-search").value.toLowerCase();
  const st = timelineSection.querySelector("#tl-status").value;
  const minD = +timelineSection.querySelector("#tl-demand").value;
  return DATA.timeline.filter(t =>
    t.demand >= minD &&
    (!q || t.artist.toLowerCase().includes(q)) &&
    (st === "" || (st === "booked") === (t.booked !== null)))
    .map(t => ({...t, booked: t.booked ?? "", lead: t.lead ?? -1}));
};
const renderTimeline = sortable(timelineSection.querySelector("#tl-table"), tlRows, rows => {
  timelineSection.querySelector("#tl-count").textContent = `${rows.length} artists`;
  timelineSection.querySelector("#tl-table tbody").innerHTML = rows.slice(0, 300).map(t => `<tr>
    <td style="font-weight:550">${esc(t.artist)}</td>
    <td>${scorebar(t.demand)}</td>
    <td class="num" style="white-space:nowrap">${t.entered ?? "—"}</td>
    <td class="num" style="white-space:nowrap">${t.booked ? `<span class="pill zero">${t.booked}</span>` : `<span class="pill some">open</span>`}</td>
    <td class="num">${t.lead >= 0
      ? (t.quality === "genuine"
          ? `<span class="pill hit">${t.lead}d</span>`
          : t.quality
            ? `<span title="${QUALITY_WHY[t.quality]}" style="color:var(--muted)">${t.lead}d <span class="pill some">${t.quality}</span></span>`
            : t.lead)
      : "—"}</td>
    <td style="color:var(--ink-2)">${esc(t.where || "—")}</td>
  </tr>`).join("");
}, ["booked", -1]);
["tl-search", "tl-status"].forEach(id => timelineSection.querySelector("#" + id).addEventListener("input", renderTimeline));
timelineSection.querySelector("#tl-demand").addEventListener("input", (e) => {
  timelineSection.querySelector("#tl-demand-v").textContent = e.target.value; renderTimeline();
});

/* ---------------- Track record ---------------- */
const SB = DATA.scoreboard;
const STATUS_PILL = {
  open: `<span class="pill some">open</span>`,
  hit: `<span class="pill hit">HIT</span>`,
  miss: `<span class="pill miss">miss</span>`,
  void: `<span class="pill some">void</span>`,
};
function evidenceLine(c) {
  const e = c.evidence || {};
  if (c.kind === "artist" && e.demandScore != null) {
    const bits = [`demand ${e.demandScore}`, `${e.chartingTracks} charting tracks`,
      `${e.bookingsAtCall} Miami booking${e.bookingsAtCall === 1 ? "" : "s"}`];
    if (e.bestChartRank) bits.push(`best #${e.bestChartRank.rank} ${esc(LABEL_BY_KEY[e.bestChartRank.chart] || e.bestChartRank.chart)}`);
    if (e.lastPlayedAtCall) bits.push(`last played ${e.lastPlayedAtCall}`);
    else bits.push("no Miami show on record");
    return bits.join(" · ");
  }
  if (c.kind === "genre" && e.demandSharePct != null) return `${e.demandSharePct}% of total demand at call time`;
  return e.snapshotDate ? `snapshot ${e.snapshotDate}` : "";
}
const trackSection = el(`<section>
  <div class="stats">
    <div class="stat"><div class="v hot">${SB.hitRate != null ? SB.hitRate + "%" : "—"}</div><div class="k">hit rate${SB.resolved ? ` (${SB.hits}/${SB.resolved} resolved)` : " — nothing resolved yet"}</div></div>
    <div class="stat"><div class="v">${SB.medianLead ?? "—"}</div><div class="k">median lead (days)</div></div>
    <div class="stat"><div class="v">${SB.bestLead ?? "—"}</div><div class="k">best lead (days)</div></div>
    <div class="stat"><div class="v">${SB.open}</div><div class="k">calls still open</div></div>
    <div class="stat"><div class="v">${DATA.receipts.trackingDays}</div><div class="k">days of daily snapshots</div></div>
  </div>
  <div class="card">
    <h2>Calls on the record</h2>
    <div class="sub">Each call was logged <em>before</em> its outcome, with the metrics frozen as they stood that day. <code>calls.json</code> is committed to git, so every entry carries a commit timestamp that can't be back-dated — that's what makes this evidence rather than a story. Artist calls resolve themselves when a Miami booking appears; misses are recorded too.</div>
    <div class="controls">
      <select id="tc-status">
        <option value="">All calls</option><option value="open">Open</option>
        <option value="hit">Hits</option><option value="miss">Misses</option>
      </select>
      <span style="margin-left:auto;color:var(--muted);font-size:12px" id="tc-count"></span>
    </div>
    <div class="table-wrap"><table id="tc-table">
      <thead><tr><th data-k="madeOn" class="sorted">Logged</th><th data-k="subject">Subject</th><th>Call</th>
        <th>Evidence at the time</th><th data-k="status">Status</th><th data-k="leadSort">Lead</th></tr></thead>
      <tbody></tbody>
    </table></div>
    ${!DATA.calls.length ? `<div class="sub" style="margin-top:14px">No calls logged yet. Add one:<br>
      <code style="color:var(--ink-2)">uv run python log_call.py "Vlace" "Will get a Miami booking" --why "72 demand, never played Miami"</code></div>` : ""}
  </div>
</section>`);
main.appendChild(trackSection);
const tcRows = () => {
  const st = trackSection.querySelector("#tc-status").value;
  return DATA.calls.filter(c => !st || c.status === st)
    .map(c => ({...c, leadSort: c.leadDays ?? -1}));
};
const renderTrack = sortable(trackSection.querySelector("#tc-table"), tcRows, rows => {
  trackSection.querySelector("#tc-count").textContent = `${rows.length} call${rows.length === 1 ? "" : "s"}`;
  trackSection.querySelector("#tc-table tbody").innerHTML = rows.map(c => `<tr>
    <td class="num" style="white-space:nowrap">${c.madeOn}</td>
    <td style="font-weight:550">${esc(c.subject)}<div style="color:var(--muted);font-size:11px">${c.kind}</div></td>
    <td>${esc(c.claim)}${c.rationale ? `<div style="color:var(--muted);font-size:11.5px;margin-top:2px">${esc(c.rationale)}</div>` : ""}</td>
    <td style="color:var(--ink-2);font-size:12px;max-width:280px">${evidenceLine(c)}</td>
    <td>${STATUS_PILL[c.status]}${c.resolution ? `<div style="color:var(--muted);font-size:11px;margin-top:3px">${esc(c.resolution)}</div>` : ""}</td>
    <td class="num">${c.leadDays != null ? c.leadDays + "d" : "—"}</td>
  </tr>`).join("");
}, ["madeOn", -1]);
trackSection.querySelector("#tc-status").addEventListener("input", renderTrack);

renderGaps(); renderVenues(); renderEvents(); renderTimeline(); renderTrack();
selectTab(0);
</script>
</body>
</html>
